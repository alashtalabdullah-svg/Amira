<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فاتورة تقديم خدمات استشارية | أميرة غربي الشمري</title>
    
    <!-- Tailwind CSS CDN (Optional Visual Enhancement) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <script>
        if (window.tailwind) {
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            navy: { 950: '#090d16', 900: '#0f172a', 800: '#1e3a8a', 700: '#1d4ed8' },
                            skyblue: { 500: '#0ea5e9', 600: '#0284c7', 50: '#f0f9ff' }
                        },
                        fontFamily: {
                            ar: ['Tajawal', 'sans-serif'],
                            en: ['Inter', 'sans-serif']
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* CSS Core Resets - Standard Fail-Safe */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            visibility: visible !important;
            opacity: 1 !important;
            font-family: 'Tajawal', 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f1f5f9;
            color: #0f172a;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        /* Content Editable Visual Style */
        [contenteditable="true"] {
            outline: none;
            transition: background-color 0.2s ease, box-shadow 0.2s ease;
            border-radius: 4px;
            padding: 2px 4px;
        }
        [contenteditable="true"]:hover,
        [contenteditable="true"]:focus {
            background-color: #e0f2fe;
            box-shadow: 0 0 0 2px #0284c7;
        }

        /* Strict Single A4 Page Print Engine */
        @media print {
            @page {
                size: A4 portrait;
                margin: 0; /* Zero page margin to hand control to wrapper */
            }

            html, body {
                background: #ffffff !important;
                width: 210mm;
                height: 297mm;
                overflow: hidden;
            }

            .no-print {
                display: none !important;
            }

            .invoice-card {
                box-shadow: none !important;
                border: none !important;
                border-radius: 0 !important;
                width: 210mm !important;
                max-width: 210mm !important;
                height: 297mm !important;
                max-height: 297mm !important;
                padding: 12mm 15mm !important;
                margin: 0 auto !important;
                position: relative !important;
                box-sizing: border-box !important;
                page-break-inside: avoid !important;
                page-break-after: avoid !important;
                display: flex !important;
                flex-direction: column !important;
                justify-content: space-between !important;
            }

            [contenteditable="true"]:hover,
            [contenteditable="true"]:focus {
                background: transparent !important;
                box-shadow: none !important;
            }

            /* Prevent table breaks */
            table {
                page-break-inside: avoid;
            }
            tr {
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body class="py-6 px-3 sm:px-4 text-slate-800">

    <!-- Top Action Toolbar (No Print) -->
    <header class="max-w-4xl mx-auto mb-4 flex flex-wrap justify-between items-center gap-3 no-print bg-white p-3 rounded-2xl shadow-sm border border-slate-200">
        <!-- Language Switcher -->
        <div class="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200">
            <button id="btnAr" onclick="switchLanguage('ar')" class="px-4 py-1.5 rounded-lg text-xs font-bold transition bg-white text-slate-900 shadow-sm">
                العربية
            </button>
            <button id="btnEn" onclick="switchLanguage('en')" class="px-4 py-1.5 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 transition">
                English
            </button>
        </div>

        <!-- Help Info -->
        <div class="hidden md:flex items-center gap-2 text-slate-500 text-xs">
            <svg class="w-4 h-4 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <span data-i18n="editHint">اضغط على أي نص للتعديل مباشرة. يتم حساب الإجمالي تلقائياً.</span>
        </div>

        <!-- Action Buttons -->
        <div class="flex gap-2">
            <button onclick="addRow()" class="bg-slate-800 hover:bg-slate-900 text-white px-3.5 py-2 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 shadow-sm">
                <svg class="w-4 h-4 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                <span data-i18n="addRowBtn">إضافة بند</span>
            </button>
            <button onclick="window.print()" class="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-md">
                <svg class="w-4 h-4 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path>
                </svg>
                <span data-i18n="printBtn">طباعة / حفظ PDF</span>
            </button>
        </div>
    </header>

    <!-- Main Executive Invoice Document Container -->
    <main class="invoice-card max-w-4xl mx-auto bg-white p-6 sm:p-8 rounded-3xl shadow-xl border border-slate-200 relative overflow-hidden">
        
        <!-- Top Visual Accent Line -->
        <div class="absolute top-0 right-0 left-0 h-2 bg-gradient-to-r from-slate-900 via-blue-900 to-sky-500"></div>

        <div>
            <!-- Header Section -->
            <section class="flex flex-col sm:flex-row justify-between items-start gap-4 pb-4 border-b border-slate-200">
                <!-- Consultant Info -->
                <div class="space-y-1 max-w-lg">
                    <h1 class="text-xl sm:text-2xl font-extrabold text-slate-900 tracking-tight leading-snug" contenteditable="true" data-i18n="consultantName">أميرة غربي الشمري</h1>
                    <p class="text-sky-600 font-bold text-xs sm:text-sm tracking-wide" contenteditable="true" data-i18n="consultantTitle">مستشار إداري وتنفيذي</p>
                    
                    <div class="pt-1 space-y-0.5 text-xs text-slate-600">
                        <p class="flex items-center gap-2">
                            <span class="font-semibold text-slate-900" data-i18n="idLabel">الهوية الوطنية:</span>
                            <span contenteditable="true" dir="ltr" class="font-mono">1043972080</span>
                        </p>
                        <p class="flex items-center gap-2">
                            <span class="font-semibold text-slate-900" data-i18n="emailLabel">البريد الإلكتروني:</span>
                            <span contenteditable="true" dir="ltr">Amirah@example.com</span>
                        </p>
                        <p class="flex items-center gap-2">
                            <span class="font-semibold text-slate-900" data-i18n="phoneLabel">الجوال:</span>
                            <span contenteditable="true" dir="ltr">+966 50 000 0000</span>
                        </p>
                        <p class="flex items-center gap-2">
                            <span class="font-semibold text-slate-900" data-i18n="addressLabel">العنوان:</span>
                            <span contenteditable="true" data-i18n="consultantAddress">الرياض، المملكة العربية السعودية</span>
                        </p>
                    </div>
                </div>

                <!-- Invoice Badge & Meta Details -->
                <div class="w-full sm:w-auto flex flex-col justify-between items-start sm:items-end gap-2">
                    <div class="bg-slate-900 text-white px-4 py-1.5 rounded-xl shadow-sm border-r-4 ltr:border-r-0 ltr:border-l-4 border-sky-500">
                        <h2 class="text-sm font-bold tracking-widest uppercase" contenteditable="true" data-i18n="invoiceTitle">مطالبة مالية</h2>
                    </div>
                    
                    <div class
