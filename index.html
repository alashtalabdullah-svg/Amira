<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فاتورة تقديم خدمات استشارية | أميرة غربي الشمري</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            950: '#090d16',
                            900: '#0f172a',
                            800: '#1e3a8a',
                            700: '#1d4ed8',
                        },
                        skyblue: {
                            500: '#0ea5e9',
                            600: '#0284c7',
                            50: '#f0f9ff',
                        }
                    },
                    fontFamily: {
                        ar: ['Tajawal', 'sans-serif'],
                        en: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Tajawal', 'Inter', sans-serif;
            background-color: #f1f5f9;
            color: #0f172a;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        /* Content Editable Styling */
        [contenteditable="true"] {
            outline: none;
            transition: all 0.2s ease;
            border-radius: 4px;
            padding: 2px 4px;
        }
        [contenteditable="true"]:hover {
            background-color: #e0f2fe;
            box-shadow: 0 0 0 2px #38bdf8;
        }
        [contenteditable="true"]:focus {
            background-color: #e0f2fe;
            box-shadow: 0 0 0 2px #0284c7;
        }

        /* Print Specific Styling - Optimized for Single A4 Page */
        @media print {
            @page {
                size: A4 portrait;
                margin: 0.8cm;
            }

            html, body {
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
                min-height: auto !important;
                height: auto !important;
            }

            .no-print {
                display: none !important;
            }

            .invoice-card {
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
                margin: 0 !important;
                width: 100% !important;
                max-width: 100% !important;
                border-radius: 0 !important;
                page-break-inside: avoid;
                page-break-after: avoid;
            }

            .invoice-card section.my-4 {
                margin-top: 0.6rem !important;
                margin-bottom: 0.6rem !important;
            }
            .invoice-card section.mt-6 {
                margin-top: 1rem !important;
            }
            .invoice-card section.pb-5 {
                padding-bottom: 0.6rem !important;
            }
            .invoice-card section.pt-4 {
                padding-top: 0.6rem !important;
            }

            table {
                page-break-inside: auto;
            }
            tr {
                page-break-inside: avoid;
                page-break-after: auto;
            }

            [contenteditable="true"]:hover, [contenteditable="true"]:focus {
                background: transparent !important;
                box-shadow: none !important;
            }
        }
    </style>
</head>
<body class="min-h-screen py-4 px-3 sm:px-4 text-slate-800">

    <!-- Top Action Toolbar (No Print) -->
    <header class="max-w-4xl mx-auto mb-4 flex flex-wrap justify-between items-center gap-3 no-print bg-white p-3 rounded-2xl shadow-sm border border-slate-200">
        <!-- Language Switcher -->
        <div class="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200">
            <button id="btnAr" onclick="switchLanguage('ar')" class="px-4 py-1.5 rounded-lg text-xs font-bold transition bg-white text-navy-900 shadow-sm">
                العربية
            </button>
            <button id="btnEn" onclick="switchLanguage('en')" class="px-4 py-1.5 rounded-lg text-xs font-semibold text-slate-600 hover:text-navy-900 transition">
                English
            </button>
        </div>

        <!-- Help Info -->
        <div class="hidden md:flex items-center gap-2 text-slate-500 text-xs">
            <svg class="w-4 h-4 text-skyblue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <span data-i18n="editHint">اضغط على أي نص للتعديل مباشرة. يتم حساب الإجمالي تلقائياً.</span>
        </div>

        <!-- Buttons -->
        <div class="flex gap-2">
            <button onclick="addRow()" class="bg-slate-800 hover:bg-slate-900 text-white px-3.5 py-2 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 shadow-sm">
                <svg class="w-4 h-4 text-skyblue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                <span data-i18n="addRowBtn">إضافة بند</span>
            </button>
            <button onclick="window.print()" class="bg-navy-900 hover:bg-navy-800 text-white px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-md">
                <svg class="w-4 h-4 text-skyblue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path>
                </svg>
                <span data-i18n="printBtn">طباعة / حفظ PDF</span>
            </button>
        </div>
    </header>

    <!-- Main Executive Invoice Document -->
    <main class="invoice-card max-w-4xl mx-auto bg-white p-6 sm:p-8 rounded-3xl shadow-xl border border-slate-200 relative overflow-hidden">
        
        <!-- Top Visual Accent Line -->
        <div class="absolute top-0 right-0 left-0 h-2 bg-gradient-to-r from-navy-900 via-navy-800 to-skyblue-500"></div>

        <!-- Header Section -->
        <section class="flex flex-col sm:flex-row justify-between items-start gap-4 pb-5 border-b border-slate-200">
            <!-- Consultant Info -->
            <div class="space-y-1 max-w-lg">
                <h1 class="text-xl sm:text-2xl font-extrabold text-navy-900 tracking-tight leading-snug" contenteditable="true" data-i18n="consultantName">أميرة غربي الشمري</h1>
                <p class="text-skyblue-600 font-bold text-xs sm:text-sm tracking-wide" contenteditable="true" data-i18n="consultantTitle">مستشار إ
